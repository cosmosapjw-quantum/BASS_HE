name: BASS_HE -> REI F05 original-electron derived receipt
on:
  push:
    branches: [research/bass-he-rei-f05-he-electron-response-20261101]
  pull_request:
    paths:
      - 'research/rei_f05_he_electron_bridge_20261101/**'
      - '.github/workflows/bass-he-rei-f05-electron.yml'
jobs:
  source-derived-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scientific result contract (not original REI execution)
        shell: bash
        run: |
          set -euo pipefail
          P=research/rei_f05_he_electron_bridge_20261101
          python -m unittest discover -s "$P/tests" -p 'test_*.py' -v
          python -O -m unittest discover -s "$P/tests" -p 'test_*.py' -v
          python - "$P" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          j=json.loads((p/'results/RESULT.json').read_text())
          q=p/'results/REI_F05_H_HE_ELECTRON_46080.csv.gz'
          assert hashlib.sha256(q.read_bytes()).hexdigest()==j["output_sha256"]
          assert j["unique_physical_nodes"]==46080 and j["canonical_delta"]==0
          assert j["new_ivps"]==0 and j["RUX04"]=="NOT_ADMITTED"
          print("SOURCE_DERIVED_RECEIPT_PASS",j["output_sha256"])
          PY
