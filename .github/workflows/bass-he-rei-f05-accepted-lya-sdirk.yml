name: BASS_HE accepted original HeII Ly-alpha SDIRK photon source receipt
on:
  push:
    branches:
      - research/bass-he-rei-f05-accepted-lya-sdirk-source-20261102
    paths:
      - research/rei_f05_accepted_lya_native_sdirk_source_20261102/**
      - .github/workflows/bass-he-rei-f05-accepted-lya-sdirk.yml
  pull_request:
    paths:
      - research/rei_f05_accepted_lya_native_sdirk_source_20261102/**
      - .github/workflows/bass-he-rei-f05-accepted-lya-sdirk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-derived-receipt-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full 138240-row derived physical photon receipt
        run: python3 research/rei_f05_accepted_lya_native_sdirk_source_20261102/verify_published_receipt.py
      - name: Verify source-free derived receipt under optimized Python
        run: python3 -O research/rei_f05_accepted_lya_native_sdirk_source_20261102/verify_published_receipt.py
      - name: Forbid false source admission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/rei_f05_accepted_lya_native_sdirk_source_20261102/results/SCIENCE_RESULT.json')
          a=json.loads(p.read_text())
          assert a['canonical_delta']==0 and a['production']=='HOLD'
          assert a['original_tick161']=='NOT_ACCEPTED'
          assert a['original_spectrum_and_causal_transport']=='NOT_ADMITTED'
          assert a['source_branch_f_range']==[0.1,1.0]
          print('PASS_DERIVED_ACCEPTED_SOURCE_INPUT_ONLY')
          PY
