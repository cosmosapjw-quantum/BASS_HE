[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he"
version = "0.2.0"
description = "Audited paper-derived He-H hidden-crossing research kernels"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
cloud = ["scipy==1.17.0", "threadpoolctl>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
