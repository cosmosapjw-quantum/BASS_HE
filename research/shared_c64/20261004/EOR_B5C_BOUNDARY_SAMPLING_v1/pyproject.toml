[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-optical-sampling-reference"
version = "0.1.0"
description = "Bounded atomic optical-input interpolation with independent finite-model derivative checks"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy>=1.14", "bass-he-two-state-reference==0.1.0", "bass-he-prolate-variational==0.1.0"]

[project.scripts]
bass-he-optical-sampling = "bass_he_optical_sampling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_he_optical_sampling*"]
