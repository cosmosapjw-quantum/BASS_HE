[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-optical-reference"
version = "0.1.0"
description = "Flux-conserving reference for declared finite-range optical radial operators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
bass-he-optical-reference = "bass_he_rcx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_he_rcx*"]
