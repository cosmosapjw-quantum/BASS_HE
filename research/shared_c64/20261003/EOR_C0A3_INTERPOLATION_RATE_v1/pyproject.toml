[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-liu-interpolated"
version = "0.3.0"
description = "Explicit atomic table interpolation and conditional finite-support Maxwell functionals"
requires-python = ">=3.10"
dependencies = ["bass-he-liu-native==0.2.0"]

[project.scripts]
bass-he-liu-interp = "bass_he_liu_interp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_he_liu_interp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
