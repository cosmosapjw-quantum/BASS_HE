[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-rcx-rate"
version = "0.1.0"
description = "Explicit source-limited He2+ H radiative charge-transfer thermal rate"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bass-he-rcx-rate = "bass_he_rcx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
