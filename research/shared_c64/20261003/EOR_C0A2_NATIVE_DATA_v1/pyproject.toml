[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-liu-native"
version = "0.2.0"
description = "Source-bound exact-node atomic cross-section ingestion for Liu2024"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bass-he-liu = "bass_he_liu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
