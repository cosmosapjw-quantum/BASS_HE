[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "bass-he-west82-reference"
version = "0.2.0"
description = "West82 source-unit binding and scaled high-l optical reference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
[project.scripts]
bass-he-west82 = "bass_he_west82.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_he_west82*"]
