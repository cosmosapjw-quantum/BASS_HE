[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-atomic-export"
version = "0.1.0"
description = "Explicit source-bound atomic rate and count packets with collision-free imports"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
optical = ["bass-he-west82-reference==0.2.0"]

[project.scripts]
bass-he-atomic-export = "bass_he_atomic_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_he_atomic_export*"]
