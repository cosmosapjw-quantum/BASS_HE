[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-he-atomic-moments"
version = "0.4.0"
description = "Explicit state-internal-energy moments of source-bound atomic cross sections"
requires-python = ">=3.10"
dependencies = ["bass-he-liu-interpolated==0.3.0", "bass-he-liu-native==0.2.0"]

[project.scripts]
bass-he-atomic-moments = "bass_he_atomic_moments.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_he_atomic_moments*"]
